[project]
name = "swarmlab"
version = "0.0.1"
description = "Deterministic, replayable multi-agent runs across any LLM provider"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "David Mellafe Zuvic" }]
requires-python = ">=3.13"
keywords = [
  "agents",
  "multi-agent",
  "llm",
  "orchestration",
  "deterministic",
  "replay",
  "evals",
  "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.9",
  "typer>=0.13",
  "httpx>=0.28",
  "litellm>=1.52",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.152.7",
  "ruff>=0.8",
  "pyright>=1.1.388",
  "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/dmzhq/swarmlab"
Repository = "https://github.com/dmzhq/swarmlab"
Issues = "https://github.com/dmzhq/swarmlab/issues"

[project.scripts]
swarmlab = "swarmlab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmlab"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "S",   # flake8-bandit
  "RUF", # ruff-specific
]
ignore = [
  "S101", # pytest uses assert
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=swarmlab",
  "--cov-report=term-missing",
]
testpaths = ["tests"]
filterwarnings = ["error"]
